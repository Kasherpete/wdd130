<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->

        <table class="blueTable">
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Rob Garrett</td>
              <td>He Will Make More of You </td>
              <td>BYU-I</td>
              <td>September 29, 2026</td>
            </tr>
              <td>President Alvin F. Meredith III</td>
              <td>The Mission of BYU-Idaho </td>
              <td>BYU-I</td>
              <td>September 15, 2026</td>
            <tr>
              <td>Elder James O. Fantone</td>
              <td>The Battle Is the Lord’s</td>
              <td>BYU-I</td>
              <td>September 22, 2026</td>

            </tr>
          </tbody>
        </table>




         <form action="#">

          <div id="labels-container">

            <div class="label-container">
              <label class="" for="">Speaker:</label>
              <input type="text">
            </div>

            <div class="label-container">
              <label class="" for="">Title:</label>
              <input type="text">
            </div>

            <div class="label-container">
              <label class="" for="">Location:</label>
              <input type="text">
            </div>

            <div class="label-container">
              <label class="" for="">Date:</label>
              <input type="text">
            </div>

          </div>

          
          <div class="container-3">
            <label for="">What did you like about this devotional?</label>
            <textarea type="text"></textarea>
          </div>

         </form>
      </div>
    </main>
  </div>
</body>
</html>
