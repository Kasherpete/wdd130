<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staycation</title>
    <link rel="stylesheet" href="/nielsen/styles/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="header-logo-container">
                <img style="display: inline" src="/nielsen/img/canvas.png" alt="Staycation logo">
                <p style="display: inline">Staycation</p>
            </div>
            
            <div class="header-buttons-container">
                <a class="button" href="/nielsen">Home</a>
                <a class="button" href="/nielsen/indoors">Indoors</a>
                <a class="button" href="/nielsen/outdoors">Outdoors</a>
            </div>
        </nav>
    </header>
    
    <main>

        <img src="img/backg1.png" alt="Hero Image" class="hero-img">
        <div class="hero-text">
            <div>
                <h1>Rediscover Your City</h1>
                <h3>Great adventures are closer than you think</h3>
            </div>
            
        </div>

        <a class="button activities-button" href="/">Indoor Activities</a>
        <a class="button activities-button" href="/">Outdoor Adventures</a>

        <img class="activities-img" src="img/indooractivities.png" alt="Indoor Activities">
        <img class="activities-img" src="img/outdooradventures.png" alt="Outdoor Adventures">
    </main>

    <footer>
        <nav>© 2026 Keagan Peterson</nav>
    </footer>

</body>
</html>
